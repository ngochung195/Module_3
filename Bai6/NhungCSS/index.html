<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        p {
            color: blue;
        }
    </style>
</head>

<body>
    <h1 style="color: green;">This is heading</h1>
    <p>This is an ordinary paragraph. Notice that this text is blue. The default text color for a page is defined in the
        body selector.</p>
</body>

</html>
