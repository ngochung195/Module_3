<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refactored Layout</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR: Flexbox Content-first -->
    <header class="site-navbar">
        <div class="logo">Logo</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">VeryLongGermanWordForDashboard</a>
            <a href="#">Contact</a>
        </nav>
        <div class="profile">Profile</div>
    </header>

    <main class="container-fluid my-4">
        <!-- DASHBOARD: CSS Grid (Flat Siblings) -->
        <section class="grid-dashboard mb-5">
            <div class="widget widget-large">Chart A (Span 2 hàng)</div>
            <div class="widget">Chart B</div>
            <div class="widget">Chart C</div>
            <div class="widget">Chart D</div>
        </section>

        <!-- PRICING: Bootstrap Grid & Cards -->
        <section class="pricing-section container">
            <h2 class="text-center mb-4">Bảng Giá Services</h2>
            <div class="row g-4">
                <div class="col-12 col-md-4">
                    <div class="card h-100 text-center shadow-sm">
                        <div class="card-body d-flex flex-column justify-content-center">
                            <h5 class="card-title">Gói Cơ bản</h5>
                            <p class="card-text text-muted">Dành cho cá nhân trải nghiệm</p>
                            <button class="btn btn-outline-primary mt-auto">Chọn gói</button>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card h-100 text-center border-primary shadow">
                        <div class="card-body d-flex flex-column justify-content-center">
                            <h5 class="card-title text-primary">Gói Nâng cao</h5>
                            <p class="card-text text-muted">Phù hợp nhóm nhỏ & Startup</p>
                            <button class="btn btn-primary mt-auto">Chọn gói</button>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card h-100 text-center shadow-sm">
                        <div class="card-body d-flex flex-column justify-content-center">
                            <h5 class="card-title">Gói Doanh nghiệp</h5>
                            <p class="card-text text-muted">Giải pháp quy mô lớn</p>
                            <button class="btn btn-outline-primary mt-auto">Liên hệ</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
